<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DexBrowser</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #202b45 0%, #101114 45%, #090a0d 100%);
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 700px;
    padding: 70px 20px 30px;
    text-align: center;
}

.logo {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
}

.subtitle {
    color: #8f96a8;
    font-size: 15px;
    margin-bottom: 35px;
}

.search {
    width: 100%;
    height: 58px;
    border-radius: 18px;
    border: 1px solid #303542;
    background: rgba(30,32,39,.95);
    color: white;
    font-size: 16px;
    padding: 0 20px;
    outline: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.search:focus {
    border-color: #3d7eff;
}

.quick {
    margin-top: 35px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card {
    padding: 20px 8px;
    border-radius: 16px;
    background: #181a20;
    border: 1px solid #292c35;
    color: white;
    text-decoration: none;
    transition: .2s;
}

.card:active {
    transform: scale(.96);
}

.icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.name {
    font-size: 13px;
    color: #c8ccd6;
}

.footer {
    margin-top: 50px;
    color: #555b6a;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">DEXBROWSER</div>

    <div class="subtitle">
        Your web. Your way.
    </div>

    <input
        class="search"
        id="search"
        placeholder="Search the web..."
        autocomplete="off"
    >

    <div class="quick">

        <a class="card" href="https://www.google.com">
            <div class="icon">🔎</div>
            <div class="name">Google</div>
        </a>

        <a class="card" href="https://www.youtube.com">
            <div class="icon">▶️</div>
            <div class="name">YouTube</div>
        </a>

        <a class="card" href="https://github.com">
            <div class="icon">💻</div>
            <div class="name">GitHub</div>
        </a>

        <a class="card" href="https://chatgpt.com">
            <div class="icon">🤖</div>
            <div class="name">ChatGPT</div>
        </a>

        <a class="card" href="https://www.wikipedia.org">
            <div class="icon">📚</div>
            <div class="name">Wikipedia</div>
        </a>

        <a class="card" href="https://discord.com">
            <div class="icon">💬</div>
            <div class="name">Discord</div>
        </a>

    </div>

    <div class="footer">
        DexBrowser • Version 3.0
    </div>

</div>

<script>

const search = document.getElementById("search");

search.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {

        let query = search.value.trim();

        if (!query) return;

        if (
            query.startsWith("http://") ||
            query.startsWith("https://")
        ) {
            location.href = query;
        }
        else if (
            query.includes(".") &&
            !query.includes(" ")
        ) {
            location.href = "https://" + query;
        }
        else {
            location.href =
                "https://www.google.com/search?q=" +
                encodeURIComponent(query);
        }
    }

});

</script>

</body>
</html>
